<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackPaint</title>
    <meta name="description" content="Diseña circuitos de carreras sobre un mapa real." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e11d2e'/%3E%3Cpath d='M8 22c0-8 6-12 10-12s6 3 6 6-3 6-7 6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel" class="panel">
      <header class="panel-head">
        <h1>Track<span>Paint</span></h1>
        <button id="panel-toggle" class="icon-btn" aria-label="Mostrar u ocultar panel" title="Mostrar u ocultar panel">☰</button>
      </header>

      <div class="panel-body">
        <form id="search" class="search" autocomplete="off">
          <input id="search-input" type="search" placeholder="Buscar ciudad, calle o lugar…" aria-label="Buscar lugar" />
          <ul id="search-results" class="search-results" hidden></ul>
        </form>

        <label class="field">
          <span>Nombre del circuito</span>
          <input id="name" type="text" maxlength="80" />
        </label>

        <div class="tools" role="radiogroup" aria-label="Herramienta">
          <button data-tool="draw" role="radio" title="Haz clic en el mapa para añadir puntos al final">✏️ Dibujar</button>
          <button data-tool="edit" role="radio" title="Arrastra puntos o haz clic en la pista para insertar">✋ Editar</button>
          <button data-tool="pan" role="radio" title="Solo mover el mapa">🧭 Navegar</button>
        </div>
        <p id="hint" class="hint"></p>

        <div class="options">
          <label class="check"><input id="closed" type="checkbox" /> Circuito cerrado</label>
          <label class="check"><input id="snap" type="checkbox" /> Seguir las calles</label>
          <label class="field range">
            <span>Ancho de pista <output id="width-out"></output></span>
            <input id="width" type="range" min="4" max="20" step="0.5" />
          </label>
        </div>

        <dl class="stats">
          <div><dt>Longitud</dt><dd id="stat-length">0 m</dd></div>
          <div><dt>Puntos</dt><dd id="stat-points">0</dd></div>
        </dl>
        <p id="status" class="status" role="status"></p>

        <div class="row">
          <button id="undo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
          <button id="redo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
          <button id="fit" title="Encuadrar el circuito">⤢ Encuadrar</button>
        </div>
        <div class="row">
          <button id="save" class="primary">💾 Guardar</button>
          <button id="new">＋ Nuevo</button>
          <button id="clear" class="danger">Borrar trazado</button>
        </div>

        <section class="saved">
          <h2>Mis circuitos</h2>
          <ul id="saved-list"></ul>
          <div class="row">
            <button id="export-json">⬇ Exportar archivo</button>
            <label class="button">⬆ Importar archivo<input id="import-json" type="file" accept=".json,application/json" hidden /></label>
          </div>
        </section>
      </div>
    </aside>

    <div class="view-switch">
      <div class="seg" role="group" aria-label="Fondo">
        <button data-style="mapa">Mapa</button>
        <button data-style="satelite">Satélite</button>
      </div>
      <div class="seg" role="group" aria-label="Vista">
        <button data-view="2d">2D</button>
        <button data-view="3d">3D</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
