<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackPaint</title>
    <meta name="description" content="Diseña circuitos de carreras sobre un mapa real." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e11d2e'/%3E%3Cpath d='M8 22c0-8 6-12 10-12s6 3 6 6-3 6-7 6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel" class="panel">
      <header class="panel-head">
        <h1>Track<span>Paint</span></h1>
        <button id="panel-toggle" class="icon-btn" aria-label="Mostrar u ocultar panel" title="Mostrar u ocultar panel">☰</button>
      </header>

      <div class="panel-body">
        <form id="search" class="search" autocomplete="off">
          <input id="search-input" type="search" placeholder="Buscar ciudad, calle o lugar…" aria-label="Buscar lugar" />
          <ul id="search-results" class="search-results" hidden></ul>
        </form>

        <label class="field">
          <span>Nombre del circuito</span>
          <input id="name" type="text" maxlength="80" />
        </label>

        <div class="tools" role="radiogroup" aria-label="Herramienta">
          <button data-tool="paint" role="radio" title="Arrastra sobre el mapa para pintar la pista">🖌️ Pintar</button>
          <button data-tool="draw" role="radio" title="Haz clic en el mapa para añadir puntos al final">✏️ Puntos</button>
          <button data-tool="edit" role="radio" title="Arrastra puntos o haz clic en la pista para insertar">✋ Editar</button>
          <button data-tool="pan" role="radio" title="Solo mover el mapa">🧭 Mover</button>
        </div>
        <p id="hint" class="hint"></p>

        <div class="options">
          <label class="check"><input id="closed" type="checkbox" /> Circuito cerrado</label>
          <label class="check"><input id="snap" type="checkbox" /> Seguir las calles</label>
          <label class="field range">
            <span>Ancho de pista <output id="width-out"></output></span>
            <input id="width" type="range" min="4" max="20" step="0.5" />
          </label>
        </div>

        <section class="elements">
          <h2>Elementos de pista</h2>
          <div class="el-grid" role="radiogroup" aria-label="Elemento">
            <button data-el="kerb" role="radio"><i class="sw kerb"></i>Piano</button>
            <button data-el="wall" role="radio"><i class="sw wall"></i>Muro</button>
            <button data-el="fence" role="radio"><i class="sw fence"></i>Valla</button>
            <button data-el="tyres" role="radio"><i class="sw tyres"></i>Neumáticos</button>
            <button data-el="gravel" role="radio"><i class="sw gravel"></i>Grava</button>
            <button data-el="runoff" role="radio"><i class="sw runoff"></i>Escapatoria</button>
            <button data-el="grass" role="radio"><i class="sw grass"></i>Césped</button>
            <button data-el="pitlane" role="radio"><i class="sw pitlane"></i>Pit lane</button>
            <button data-el="pits" role="radio"><i class="sw pits"></i>Boxes</button>
            <button data-el="grandstand" role="radio"><i class="sw grandstand"></i>Grada</button>
          </div>
          <div id="kerb-colors" class="seg flat kerb-colors" role="group" aria-label="Color del piano" hidden>
            <button data-kerb="red" aria-pressed="true"><i class="sw kerb"></i>Rojo</button>
            <button data-kerb="blue"><i class="sw kerb blue"></i>Azul</button>
            <button data-kerb="yellow"><i class="sw kerb yellow"></i>Amarillo</button>
          </div>
          <div class="row">
            <button id="auto-kerbs" title="Pone pianos en el interior y a la salida de cada curva">Pianos en las curvas</button>
            <button id="auto-walls" title="Muros a ambos lados de toda la pista, como en un circuito urbano">Muros a los lados</button>
          </div>
          <h2 class="sub">Carrera</h2>
          <div class="el-grid" role="radiogroup" aria-label="Elemento de carrera">
            <button data-el="sector" role="radio"><i class="sw sector"></i>Sectores</button>
            <button data-el="speedtrap" role="radio"><i class="sw speedtrap"></i>Speed trap</button>
            <button data-el="straightmode" role="radio" title="Zonas de aerodinámica activa que sustituyen al DRS desde 2026"><i class="sw straightmode"></i>Straight Mode</button>
            <button data-el="overtake" role="radio" title="Punto de detección del Overtake Mode"><i class="sw overtake"></i>Overtake Mode</button>
          </div>
          <button id="auto-race" title="3 sectores iguales, zonas de Straight Mode en las rectas largas, speed trap y detección de Overtake Mode">Sectores, speed trap y Straight Mode automáticos</button>
          <h2 class="sub">Seguridad</h2>
          <div class="el-grid" role="radiogroup" aria-label="Elemento de seguridad">
            <button data-el="marshal" role="radio"><i class="sw marshal"></i>Comisarios</button>
            <button data-el="crane" role="radio"><i class="sw crane"></i>Grúa</button>
          </div>
          <button id="auto-marshals" title="Un puesto en el exterior de cada curva y más en las rectas (cada 250 m como máximo), y una grúa en cada curva">Comisarios y grúas automáticos</button>
          <div id="selection" class="selection" hidden>
            <div class="sel-head"><strong id="sel-name"></strong><button id="sel-close" class="icon-btn" aria-label="Quitar selección">✕</button></div>
            <label id="sel-length-wrap" class="field inline"><span>Largo (m)</span><input id="sel-length" type="number" min="5" max="500" step="5" /></label>
            <div class="row">
              <button id="sel-rotate-left" title="Girar 15° a la izquierda">↺ 15°</button>
              <button id="sel-rotate-right" title="Girar 15° a la derecha">↻ 15°</button>
              <button id="sel-flip" title="Pasar al otro lado de la pista">⇄ Cambiar lado</button>
              <button id="sel-delete" class="danger" title="Borrar (Supr)">🗑 Borrar</button>
            </div>
          </div>
        </section>

        <dl class="stats">
          <div><dt>Longitud</dt><dd id="stat-length">0 m</dd></div>
          <div><dt>Puntos</dt><dd id="stat-points">0</dd></div>
        </dl>
        <p id="status" class="status" role="status"></p>

        <div class="row">
          <button id="undo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
          <button id="redo" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
          <button id="fit" title="Encuadrar el circuito">⤢ Encuadrar</button>
        </div>
        <button id="poster" class="poster-btn">🖼️ Exportar póster</button>
        <div class="row">
          <button id="save" class="primary">💾 Guardar</button>
          <button id="new">＋ Nuevo</button>
          <button id="clear" class="danger">Borrar trazado</button>
        </div>

        <section class="saved">
          <h2>Mis circuitos</h2>
          <ul id="saved-list"></ul>
          <div class="row">
            <button id="export-json">⬇ Exportar archivo</button>
            <label class="button">⬆ Importar archivo<input id="import-json" type="file" accept=".json,application/json" hidden /></label>
          </div>
        </section>
      </div>
    </aside>

    <div class="view-switch">
      <div class="seg" role="group" aria-label="Fondo">
        <button data-style="mapa">Mapa</button>
        <button data-style="satelite">Satélite</button>
      </div>
      <div class="seg" role="group" aria-label="Vista">
        <button data-view="2d">2D</button>
        <button data-view="3d">3D</button>
      </div>
      <div class="seg">
        <button id="play" title="Recorre una vuelta con la cámara siguiendo al coche (Esc para parar)">▶ Vuelta</button>
      </div>
    </div>

    <div id="lap-hud" class="lap-hud" hidden></div>

    <dialog id="poster-dialog" class="poster-dialog">
      <div class="poster-head">
        <h2>Póster del circuito</h2>
        <button id="poster-close" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>
      <div class="poster-body">
        <div class="poster-preview"><canvas id="poster-canvas"></canvas></div>
        <div class="poster-side">
          <label class="field"><span>Nombre</span><input id="poster-name" type="text" maxlength="80" /></label>
          <label class="field"><span>Ciudad</span><input id="poster-city" type="text" maxlength="80" /></label>
          <label class="field"><span>País</span><input id="poster-country" type="text" maxlength="60" /></label>
          <div class="field">
            <span>Estilo</span>
            <div class="seg flat" role="group" aria-label="Estilo">
              <button data-theme="oscuro">Oscuro</button>
              <button data-theme="claro">Claro</button>
            </div>
          </div>
          <label class="check"><input id="poster-city-bg" type="checkbox" checked /> Calles de la ciudad de fondo</label>
          <p id="poster-status" class="hint"></p>
          <button id="poster-download" class="primary">⬇ Descargar PNG</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
